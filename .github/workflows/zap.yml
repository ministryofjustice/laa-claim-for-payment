name: ZAP
on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on (default: main)'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: read

jobs:
  zap_scan:
    name: Scan the claim for payment API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Trigger ZAP workflow run
        uses: ./.github/actions/trigger_workflow
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          org: ministryofjustice
          repo: claim-assess-regression-tests
          workflow: zap-api.yml
          ref: ${{ inputs.branch }}
          extra-args: '-f target="http://localhost:8080" -f application="laa-claim-for-payment"'
