name: Build and deploy after PR merged

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          java-version: 25
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Build and test
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test coverage verification
        run: ./gradlew jacocoTestCoverageVerification

      - name: Integration test
        run: ./gradlew integrationTest --tests '*IntegrationTest'

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: test-results
          path: claim-for-payment-service/build/test-results
          retention-days: 14

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: checkstyle-report
          path: claim-for-payment-service/build/reports/checkstyle
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: test-report
          path: claim-for-payment-service/build/reports/tests
          retention-days: 14

      - name: Upload jacoco coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: jacoco-coverage-report
          path: claim-for-payment-service/build/reports/jacoco
          retention-days: 14

  pact-test:
    needs: [ build-test ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/pact-and-publish.yml@a5977e695ff627aab738dd22a1e4322e78beada6 #v2.4.0
    permissions:
      contents: write
      packages: write
    with:
      pacticipant_name: "laa-claim-for-payment"
      pact_test_task: "pactTest"
      publish_pact_results: true
      git_branch: 'main'
      pact_tags: 'candidate'
      java_version: 25
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
      pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
      pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  ecr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claim-for-payment-service
            context: ./claim-for-payment-service
            dockerfile: ./claim-for-payment-service/Dockerfile
            ecr-repository: ${{ vars.LAA_CLAIM_FOR_PAYMENT_ECR_REPOSITORY }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          java-version: 25
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Build and test
        run: ./gradlew :${{ matrix.name }}:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS creds (BFF)
        if: matrix.name == 'claim-for-payment-service'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d #v6.2.2
        with:
          role-to-assume: ${{ secrets.LAA_CLAIM_FOR_PAYMENT_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.LAA_CLAIM_FOR_PAYMENT_ECR_REGION }}

      - name: login to registry
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 #v2.1.6
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}-${{ matrix.name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push image with local action
        uses: ./.github/actions/build_and_push
        with:
          image_registry: ${{ secrets.ECR_REGISTRY_URL }}
          image_repo: ${{ matrix.ecr-repository }}
          dockerfile_path: ${{ matrix.dockerfile }}
          build_context: ${{ matrix.context }}
          image_tag: ${{ env.IMAGE_TAG }}

  vulnerability-report:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: legal-aid-agency
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Run Snyk to check app for vulnerabilities
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 #v1.0.0
        continue-on-error: true # To make sure that SARIF upload gets called
        with:
          command: monitor
          args: --org=$SNYK_ORG --all-projects --exclude=$SNYK_TEST_EXCLUDE --target-reference=$SNYK_TARGET_REFERENCE

      - name: Generate sarif Snyk report
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 #v1.0.0
        continue-on-error: true
        with:
          args: --org=$SNYK_ORG --all-projects --exclude=$SNYK_TEST_EXCLUDE --target-reference=$SNYK_TARGET_REFERENCE --sarif-file-output=snyk-app.sarif

      # Fix/hack for Snyk's sarif file to avoid this error uploading to GitHub.
      # See https://github.com/github/codeql-action/issues/2187 for more context.
      - name: Fix undefined values
        run: |
          sed -i 's/"security-severity": "undefined"/"security-severity": "0"/g' snyk-app.sarif

      - name: Upload result to GitHub Code Scanning
        continue-on-error: true # need to account for snyk test producing multiple runs in sarif
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 #v4.37.2
        with:
          sarif_file: snyk-app.sarif

  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    needs:
      - ecr
      - vulnerability-report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Deploy to Dev
        uses: ./.github/actions/deploy
        with:
          ecr-repository: ${{ vars.LAA_CLAIM_FOR_PAYMENT_ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: dev
          session_secret: ${{ secrets.SESSION_SECRET }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_phase: ${{ vars.SERVICE_PHASE }}
          department_name: ${{ vars.DEPARTMENT_NAME }}
          department_url: ${{ vars.DEPARTMENT_URL }}
          contact_email: ${{ vars.CONTACT_EMAIL }}
          service_url: ${{ vars.SERVICE_URL }}
          session_name: ${{ vars.SESSION_NAME}}
          ratelimit_headers_enabled: ${{ vars.RATELIMIT_HEADERS_ENABLED }}
          ratelimit_storage_uri: ${{ vars.RATELIMIT_STORAGE_URI }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_artifact: "laa-claim-for-payment"

  run-e2e:
    needs: ecr
    runs-on: ubuntu-latest
    env:
      ORG: ministryofjustice
      REPO: claim-assess-regression-tests
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.ORG }}
          repositories: ${{ env.REPO }}

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ steps.generate_token.outputs.token }}" | gh auth login --with-token

      - name: Trigger E2E workflow run
        run: |
          OUTPUT=$(gh workflow run qa-ci.yml --repo "$ORG/$REPO" --ref main)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo '/actions/runs/[0-9]+')
          RUN_ID="${URL##*/}"
          echo "Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for E2E workflow run to finish
        run: |
          while true; do
            OUTPUT=$(gh run view "$RUN_ID" --repo "$ORG/$REPO" --json status,conclusion)
            STATUS=$(echo "$OUTPUT" | jq -r '.status')
            CONCLUSION=$(echo "$OUTPUT" | jq -r '.conclusion')

            echo "Status: $STATUS"

            if [ "$STATUS" == "completed" ]; then
              echo "Conclusion: $CONCLUSION"
              if [ "$CONCLUSION" != "success" ]; then
                exit 1
              fi
              break
            fi

            sleep 10
          done

  deploy-uat:
    environment: uat
    runs-on: ubuntu-latest
    needs:
      - run-e2e
      - vulnerability-report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Deploy to UAT
        uses: ./.github/actions/deploy
        with:
          ecr-repository: ${{ vars.LAA_CLAIM_FOR_PAYMENT_ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: uat
          session_secret: ${{ secrets.SESSION_SECRET }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_phase: ${{ vars.SERVICE_PHASE }}
          department_name: ${{ vars.DEPARTMENT_NAME }}
          department_url: ${{ vars.DEPARTMENT_URL }}
          contact_email: ${{ vars.CONTACT_EMAIL }}
          service_url: ${{ vars.SERVICE_URL }}
          session_name: ${{ vars.SESSION_NAME}}
          ratelimit_headers_enabled: ${{ vars.RATELIMIT_HEADERS_ENABLED }}
          ratelimit_storage_uri: ${{ vars.RATELIMIT_STORAGE_URI }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_artifact: "laa-claim-for-payment"

  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    needs:
      - run-e2e
      - vulnerability-report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Deploy to Staging
        uses: ./.github/actions/deploy
        with:
          ecr-repository: ${{ vars.LAA_CLAIM_FOR_PAYMENT_ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: staging
          session_secret: ${{ secrets.SESSION_SECRET }}
          service_name: ${{ vars.SERVICE_NAME }}
          service_phase: ${{ vars.SERVICE_PHASE }}
          department_name: ${{ vars.DEPARTMENT_NAME }}
          department_url: ${{ vars.DEPARTMENT_URL }}
          contact_email: ${{ vars.CONTACT_EMAIL }}
          service_url: ${{ vars.SERVICE_URL }}
          session_name: ${{ vars.SESSION_NAME}}
          ratelimit_headers_enabled: ${{ vars.RATELIMIT_HEADERS_ENABLED }}
          ratelimit_storage_uri: ${{ vars.RATELIMIT_STORAGE_URI }}
          ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}
          service_artifact: "laa-claim-for-payment"
