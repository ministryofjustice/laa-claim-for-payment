repos:
  - repo: local
    hooks:

      - id: spotless
        name: Spotless Code Formatting
        description: Apply code formatting to staged Java files using Spotless
        entry: ./gradlew
        language: system
        args: [":claim-for-payment-service:spotlessApply"]
        types: [java]
        pass_filenames: false
        always_run: true

      - id: checkstyle
        name: Checkstyle
        entry: ./gradlew
        language: system
        args: [ "checkstyleMain", "--quiet" ]
        pass_filenames: false

      - id: github-actions-sha-pinning
        name: GitHub Actions SHA Pinning
        description: Require external actions to be pinned to full-length commit SHAs
        entry: scripts/check-github-actions-sha-pinning.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: snyk-dependency-scan
        name: Snyk dependency scan
        entry: snyk
        language: system
        args: [ "test","--all-sub-projects","--severity-threshold=high","--policy-path=.snyk"  ]
        pass_filenames: false

      - id: snyk-code-scan
        name: Snyk code scan
        entry: snyk
        language: system
        args: [ "code", "test", "--severity-threshold=high" ,"--all-sub-projects"]
        pass_filenames: false
  - repo: https://github.com/ministryofjustice/devsecops-hooks
    rev: v1.4.1
    hooks:
      - id: baseline