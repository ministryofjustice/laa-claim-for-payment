security:
  enabled: true 

auth:
  scopes:
    claims-write: SCOPE_https://claims-api/claims_write

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:debug}
    uk.gov.justice.laa.springboot.microservice: ${APP_LOGGING_LEVEL:debug}
  structured:
    format:
      console: # disables structured logging locally
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr{faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091
      client:
        provider:
          auth-server:
            issuer-uri: http://localhost:8091    
civilclaims:
  api:
    base-url: http://localhost:8090
    #token: my-secret-token
    timeout: 30s    
          
