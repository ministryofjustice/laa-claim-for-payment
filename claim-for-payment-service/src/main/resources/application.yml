security:
  enabled: false   # feature-flag flip to true when the client is ready
spring:
  application:
    name: LAA Claim for Payment
  profiles:
    # Profile groups let you turn on multiple profiles with one name
    group:
      docker: "local"
      local-entra: "local_entra"
      uat: "uat"         
      staging: "staging" 
      prod: "prod"  
      dev: "dev"     
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
  security:
    oauth2:
      client:
        registration:
          downstream-api-obo:
            provider: auth-server
            client-id: ${AUDIENCE:https://claims-api}
            client-secret: ${CLIENT_SECRET:api-mock-secret}
            client-authentication-method: client_secret_post
            # This triggers the OBO flow logic in Spring
            authorization-grant-type: urn:ietf:params:oauth:grant-type:jwt-bearer
            scope:
              - ${CIVIL_CLAIMS_WRITE_SCOPE:https://civil-claims-api/data_read}

# used by actuator info endpoint
info:
  app:
    name: LAA Civil CLaim for Payment Service
    description: Provides a REST API to Claim and Assess frontends.
    version: 1.0.0

management:
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  server:
    port: 8079

  # show detailed health status
  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

auth:
  scopes:
    claims-write: SCOPE_Claims.Write   

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.springboot.microservice: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}