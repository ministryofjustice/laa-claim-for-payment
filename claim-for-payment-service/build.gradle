def configureOpenApiTask = { task, cfg ->

    task.generatorName = "java"
    task.library = "resttemplate"

    if (cfg.openapiNormalizer) {
        task.openapiNormalizer.set(cfg.openapiNormalizer)
    }

    // Pass custom globalProperties if provided, otherwise default
    if (cfg.globalProperties) {
        task.globalProperties = cfg.globalProperties
    } else {
        task.globalProperties = [
            apiDocs: "false",
            modelDocs: "false"
        ]
    }

    task.inputSpec = file(cfg.inputSpec)
    task.outputDir = cfg.outputDir
    task.templateDir = file(cfg.templateDir)

    task.apiPackage = cfg.apiPackage
    task.modelPackage = cfg.modelPackage
    task.invokerPackage = cfg.invokerPackage

    task.generateModelTests = false
    task.generateApiTests = false
    task.generateModelDocumentation = false
    task.generateApiDocumentation = false

    task.additionalProperties = [
        dateLibrary            : "java8",
        useRuntimeException    : "true",
        useBeanValidation      : "true",
        useJakartaEe           : "true"
    ] + (cfg.additionalProperties ?: [])

    task.outputs.dir(task.outputDir)
}

def civilClaimsOutDir = file("$rootDir/claim-for-payment-service/generated/civil-claims-api")

tasks.register("cleanCivilClaimsApi", Delete) {
    delete(civilClaimsOutDir)
}

tasks.register(
    "generateCivilClaimsApi",
    org.openapitools.generator.gradle.plugin.tasks.GenerateTask
) {
    dependsOn(tasks.named("cleanCivilClaimsApi"))

    configureOpenApiTask(delegate, [
        inputSpec      : "$rootDir/claim-for-payment-service/src/main/openapi/stub-civil-claims-api.json",
        outputDir      : civilClaimsOutDir.toString(),
        templateDir    : "$rootDir/claim-for-payment-service/openapi-templates",
        apiPackage     : "uk.gov.justice.laa.claimforpayment.civilclaims.api",
        modelPackage   : "uk.gov.justice.laa.claimforpayment.civilclaims.model",
        invokerPackage : "uk.gov.justice.laa.claimforpayment.civilclaims.invoker",
        additionalProperties: [
            modelNamePrefix : "Civil",
            apiNamePrefix   : "Civil"
        ]
    ])
}

def accessOutDir = file("$rootDir/claim-for-payment-service/generated/data-access-api")

