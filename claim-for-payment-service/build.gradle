    configureOpenApiTask(delegate, [
        inputSpec      : "$rootDir/claim-for-payment-service/src/main/openapi/stub-data-access-api.json",
        outputDir      : accessOutDir.toString(),
        templateDir    : "$rootDir/claim-for-payment-service/openapi-templates",
        apiPackage     : "uk.gov.justice.laa.claimforpayment.access.api",
        modelPackage   : "uk.gov.justice.laa.claimforpayment.access.model",
        invokerPackage : "uk.gov.justice.laa.claimforpayment.access.invoker",
        openapiNormalizer: [
            "FILTER": "operationId:getApplications|getApplicationById"
        ],
        globalProperties: [
            apiDocs  : "false",
            modelDocs: "false",
