tasks.register('pactTest', Test) {

    systemProperty "pact.content_type.override.application/json", "application/json;charset=utf-8"

    description = 'Run pact consumer tests.'
    group = 'verification'

    def pactsDir = layout.buildDirectory.dir("pacts").get().asFile
    doFirst {
        if (pactsDir.exists()) {
            pactsDir.deleteDir()
        }
    }

    testClassesDirs = sourceSets.contractTest.output.classesDirs
    classpath = sourceSets.contractTest.runtimeClasspath
    useJUnitPlatform()
    // Resolve the directory path to a String for the system property
    systemProperty 'pact.rootDir', layout.buildDirectory.dir("pacts").get().asFile.path
}

pact {
    publish {
        pactBrokerUrl = System.getenv('PACT_BROKER_URL')
        pactBrokerUsername = System.getenv('PACT_BROKER_USERNAME')
        pactBrokerPassword = System.getenv('PACT_BROKER_PASSWORD')

        pactDirectory = layout.buildDirectory.dir("pacts").get().asFile.path

        def projectVersion = project.version != 'unspecified' ? project.version : '1.0.0';
        def gitSha = providers.environmentVariable('GIT_SHA').getOrNull()
        // Define the branch from a property, environment variable, or fallback to 'main'
        def branchName = providers.environmentVariable('GIT_BRANCH').getOrElse('main')

        // If we have a SHA, append it to the version for uniqueness
        consumerVersion = gitSha ? gitSha : projectVersion

        // For newer Pact Brokers (Recommended)
        consumerBranch = branchName

        // For older Brokers/compatibility
        tags = [branchName, projectVersion]


        // Add 'release' tag if branchName matches semantic version pattern (X.X.XXX)
        if (branchName ==~ /\d+\.\d+\.\d+/) {
            tags.add('release')
        }
        // Optional: add a generic 'dev' tag for anything not on main
        else if (branchName != 'main' && branchName != 'master') {
            tags.add('dev')
        }

        def pactTagsInput = providers.environmentVariable('PACT_TAGS').getOrNull()
        if (pactTagsInput) {
            pactTagsInput.split(',').each { tag ->
                tags.add(tag.trim())
            }
        }


    }
}

// Enforce ordering if clean runs
tasks.named('generateCivilClaimsApi') {
    mustRunAfter tasks.named('clean')
}

tasks.named('generateProviderDetailsApi') {
    mustRunAfter tasks.named('clean')
}

tasks.named('generateAccessApi') {
    mustRunAfter tasks.named('clean')
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    'generated/civil-claims-api/src/main/java',
                    'generated/provider-details-api/src/main/java',
                    'generated/data-access-api/src/main/java'
            ]
            srcDirs = ['src/main/java', 'generated/civil-claims-api/src/main/java','generated/data-access-api/src/main/java',
                       'generated/provider-details-api/src/main/java']
        }
    }
    // Add this to ensure integration tests find their resources
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources' // This is where WireMock mappings live
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
    contractTest {
        java {
            srcDir 'src/contractTest/java'
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }

}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('checkstyleMain') {
  // Only lint your handwritten code:
  source = fileTree('src/main/java')
}

dependencies {
    checkstyle "com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' 
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation "com.github.ben-manes.caffeine:caffeine:3.2.4"
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation 'org.springframework:spring-aspects'

    implementation "tools.jackson.core:jackson-databind:${rootProject.ext.jacksonDatabindVersion}"


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.2'
    testImplementation 'com.atlassian.oai:swagger-request-validator-core:3.0.0'
    testImplementation('com.atlassian.oai:swagger-request-validator-wiremock:3.0.0') {
        exclude group: 'com.github.tomakehurst', module: 'wiremock-jre8'
    }

    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'au.com.dius.pact.consumer:junit5:4.7.5'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.vintage:junit-vintage-engine'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'

    implementation("io.swagger.core.v3:swagger-core-jakarta:2.2.53") {
        exclude group: "org.apache.commons", module: "commons-lang3"
    }
    implementation "org.apache.commons:commons-lang3:3.20.0"

    // Force the entire Jackson ecosystem to 2.21.1
    implementation(platform("com.fasterxml.jackson:jackson-bom:2.22.2")) {
        version {
            strictly '2.21.1'
        }
    }

    // Overrides to resolve vulnerabilities identified by Snyk
    implementation 'ch.qos.logback:logback-core:1.6.3'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    checkstyle 'com.puppycrawl.tools:checkstyle:13.11.0'
    testImplementation 'com.github.jknack:handlebars:4.5.4'

    constraints {
        // Force transitive Rhino to a safe version
        testImplementation('org.mozilla:rhino:1.9.1') {
            because 'fix high severity XXE vulnerability SNYK-JAVA-ORGMOZILLA-1314295'
        }
    }

}

tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.generateCivilClaimsApi, tasks.generateProviderDetailsApi, tasks.generateAccessApi)
}

clean.dependsOn(
    tasks.named("cleanCivilClaimsApi"),
    tasks.named("cleanAccessApi"),
    tasks.named("cleanProviderDetailsApi")
)

